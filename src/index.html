<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PolyAI · 多模型调度台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* 顶部统一输入栏 */
    #toolbar {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0;
    }
    #toolbar input {
      flex: 1;
      padding: 10px 16px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #222;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    #toolbar input:focus { border-color: #6366f1; }
    #toolbar button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }
    #btn-send {
      background: #6366f1;
      color: #fff;
    }
    #btn-send:hover { background: #5558e6; }
    #btn-deep {
      background: #333;
      color: #aaa;
    }
    #btn-deep.active { background: #eab308; color: #000; }
    #status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #888;
      padding: 0 16px 8px;
      flex-shrink: 0;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; }
    .dot.online { background: #22c55e; }
    .dot.offline { background: #ef4444; }
    /* WebView 网格 */
    #grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 4px;
      background: #111;
      padding: 4px;
    }
    .panel {
      display: flex;
      flex-direction: column;
      background: #141414;
      border-radius: 6px;
      overflow: hidden;
    }
    .panel-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: #1e1e1e;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .panel-header .icon { font-size: 14px; }
    .panel webview, .panel iframe {
      flex: 1;
      border: none;
      width: 100%;
    }
    .panel.disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    /* 底部栏 */
    #footer {
      padding: 6px 16px;
      background: #1a1a1a;
      border-top: 1px solid #2a2a2a;
      font-size: 11px;
      color: #666;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }
    #footer a { color: #888; }
  </style>
</head>
<body>

  <!-- 统一输入栏 -->
  <div id="toolbar">
    <input id="question" type="text" placeholder="同时向所有平台提问... (回车发送)" />
    <button id="btn-deep" title="深度思考">🧠</button>
    <button id="btn-send">发送</button>
  </div>

  <!-- 状态栏 -->
  <div id="status">
    <span class="dot online"></span> API 服务: <code>http://127.0.0.1:9876</code>
    <span id="api-status">就绪</span>
  </div>

  <!-- 四宫格 WebView -->
  <div id="grid">
    <!-- 动态生成 -->
  </div>

  <!-- 底部 -->
  <div id="footer">
    <span>PolyAI v0.1 · Hermes 统一调度台</span>
    <span>Tauri + Rust + WebView</span>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
